<!DOCTYPE html>
<html>
  <head>
    <title>Arithmetic Operators in Javascript</title>  
  </head>
  <body>
    <script>
      function addTwoNumber(a, b)
      {
 //     var res = a + b;
      //      return res;
     return a+b
      }
var result = addTwoNumber(10, 6);
      console.log(result);          

function subTwoNumber(a, b)
      {
     var res = a - b;
     return res; 
      }
      var sub = subTwoNumber(20, 5);
      console.log(sub);

   function mulTwoNumber(a, b)
      {
     var res = a * b;
     return res; 
      }
      var mul = mulTwoNumber(20, 5);
      console.log(mul);   
      
function divTwoNumber(a, b)
      {
     var res = a / b;
     return res; 
      }
      var div = divTwoNumber(16, 5);
      console.log(div);
      
function remTwoNumber(a, b)
      {
     var res = a % b;
     return res; 
      }
      var rem = divTwoNumber(24, 6);
      console.log(rem);
    </script>
  </body>
</html>
