<!DOCTYPE html>
<html>
    <head>
        <title>Function</title>
    </head>
    <body>
        <h1>We are studying Function in Javascript</h1>
        <p>The function is a callable object that executes a block of code</p>
      <script>
         function printName(){
            console.log("suresh");
         };
         printName();
         function printName2(){
            console.log("anurag");
         };
         printName2();
         function printName3(firstName, lastName){
            console.log(firstName, lastName);
         };
         printName3("prithviraj", "rathod"); 
         printName3("tom", "parke");
         console.log(typeof printName3);
      </script>
    </body>
</html>
