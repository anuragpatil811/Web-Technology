<!DOCTYPE html>
<html>
    <head>
        <title>Loops in Javascript</title>
    </head>
<body>
    <h1>Applications of while loop</h1>
<script>
    var colorArray = ["red", "green", "blue", "orange", "pink", "brown", "purple", "cyan", "indigo", "white"];
    console.log(colorArray.length);
     var x = 0;
     while(x < colorArray.length)
     {
        console.log(colorArray[x]);
        x = x+1;
     }
</script>
</body>
</html>
