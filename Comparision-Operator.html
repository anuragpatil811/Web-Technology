<!DOCTYPE html>
<html>
    <head>
        <title>Comparision Operator</title>
    </head>
<body>
    <h1>Compares two values</h1>
<script>
    var x = 15;
    var result1 = x <= 10;
    var result2 = x>10;
    var result3 = x>=15;
    console.log(result1);
    console.log(result2);
    console.log(result3);
    x += 1;
    console.log(x);
    x -= 2;
    console.log(x);
</script>
</body>
</html>
