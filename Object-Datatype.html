<!DOCTYPE html>
<html>
    <head>
        <title>Object Datatype</title>
    </head>
    <body>
      <script>
       var name = "suresh"
       var age = 29;
       var isMarried = true
       console.log(name, age, isMarried);
       var personObj = {
        name:"anurag",
        age: 23,
        isMarried: true
       };
        var personObj2 = {
        "name":"atharva",
        "age": 18,
        "isMarried": false
       };
       console.log(personObj);
       console.log(personObj.name);
       console.log(personObj.age);
       console.log(personObj.isMarried);

       console.log(personObj2);
       console.log(personObj2.name);
       console.log(personObj2.age);
       console.log(personObj2.isMarried);
      </script>
    </body>
</html>
